name: Todo API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: todo-api-production
      cancel-in-progress: false

    env:
      AWS_REGION: ap-southeast-2
      AWS_PAGER: ''
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"

          jq -n --arg sha "$DEPLOY_SHA" '{
            commands: [
              ("/usr/local/bin/deploy-todo-api " + $sha)
            ],
            executionTimeout: ["900"]
          }' > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy todo-api ${DEPLOY_SHA}" \
            --parameters file://parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in {1..100}; do
            if aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json > result.json 2> invocation-error.txt; then

              STATUS=$(jq -r '.Status' result.json)
              echo "Deployment status: $STATUS"

              case "$STATUS" in
                Success)
                  jq -r '.StandardOutputContent' result.json
                  exit 0
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                *)
                  jq -r \
                    '.StandardOutputContent, .StandardErrorContent' \
                    result.json
                  exit 1
                  ;;
              esac
            else
              # A newly sent command may not be visible immediately.
              if ! grep -q "InvocationDoesNotExist" invocation-error.txt; then
                cat invocation-error.txt
                exit 1
              fi
            fi

            sleep 10
          done

          echo "Timed out waiting for deployment"
          exit 1
