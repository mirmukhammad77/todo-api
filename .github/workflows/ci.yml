name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Run one workflow per branch at a time so deployments do not overlap.
concurrency:
  group: todo-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - name: Check bootstrap and deployment shell syntax
        run: |
          bash -n infra/templates/user-data.sh.tftpl
          bash -n infra/templates/deploy.sh.tftpl
          bash -n scripts/deploy-ec2.sh

  application:
    name: Build, test and deploy application
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
      - name: Package tested application
        run: tar -czf release.tar.gz dist package.json package-lock.json
      - name: Validate deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOYMENT_BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
          SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
        run: |
          for setting in AWS_REGION AWS_ACCOUNT_ID EC2_INSTANCE_ID DEPLOYMENT_BUCKET SSM_DEPLOY_DOCUMENT; do
            if [ -z "${!setting}" ]; then
              echo "::error::Set the GitHub Actions repository variable $setting (see infra/README.md)."
              exit 1
            fi
          done
      - name: Configure AWS access keys
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy through Systems Manager
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOYMENT_BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
          SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
        run: bash scripts/deploy-ec2.sh
